name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        if: ${{ github.repository != 'Thelionsinformatica/deepseek-harness' || vars.DSH_ISSUE_AUTOMATION_ENABLED == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        if: ${{ github.repository != 'Thelionsinformatica/deepseek-harness' || vars.DSH_ISSUE_AUTOMATION_ENABLED == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
      - name: Skip upstream issue policy in the Leon fork
        if: ${{ github.repository == 'Thelionsinformatica/deepseek-harness' && vars.DSH_ISSUE_AUTOMATION_ENABLED != 'true' }}
        run: echo "Issue policy is opt-in in the Leon fork. Set DSH_ISSUE_AUTOMATION_ENABLED after configuring the fork policy."
