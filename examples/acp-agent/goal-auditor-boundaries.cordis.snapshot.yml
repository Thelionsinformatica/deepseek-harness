# Replay disables the remote adapter before boot and isolates all persisted state.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          goals:
            tool:
              completionRequiresCompletedTodos: true
              completionAuditorProvider: spawn
              completionAuditorModelProvider: deepseek-official
              completionAuditorModel: deepseek-v4-flash
              completionAuditorMaxTokens: 4096
              completionAuditorMaxAttemptsPerTurn: 1
              completionAuditorRequireArtifacts: true
          persona: |
            Verify the supplied workspace evidence before independent review. If completion is refused, inspect the goal state and pause as requested by the human.
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
          - id: audit-artifact-mutation
            name: './tests/fixtures/audit-artifact-mutation.ts'
