# Web-fetch composition for the web-fetch snapshot scenario: the web seam, a
# test-only explicitly selected loopback connector, and the model-facing web
# tools. Production's anonymous public-web provider intentionally has no
# private-network bypass, so this deterministic fixture never weakens it.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: web
            name: '@deepseek-ai/dsh-web'
            config:
              fetchProvider: snapshot-fixture
          - id: web-fetch-fixture
            name: './web-fetch-fixture-server.mjs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: false
