- id: host-collective-v2-snapshot
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./collective.cordis.yml
    patches:
      - id: control
        config:
          domainName: leon_collective
          owner: local-lab-owner
          workspace: !!js process.cwd()
          maxCalls: 48
          durationMs: 900000
          hostComposition: true
      - id: execution
        config:
          provider: collective-local
          model: qwen3.5:4b
          maxOutputTokens: 2048
          queueTimeoutMs: 120000
          turnStepLimit: 8
          reviewReserve: { calls: 8, reviewerRole: checker }
          allowedTools:
            - send_message
            - followup_task
            - list_agents
            - wait_agent
            - team_task_get
            - team_task_list
            - mission_task
            - mission_task_complete
            - mission_inspect
            - mission_verify
            - mission_patch
      - id: local-adapter
        name: '@deepseek-ai/dsh-llm-pi-ai'
        disabled: true
      - insert:
          - id: fixture
            name: './tests/fixtures/collective-llm.mjs'
      - id: import-lab
        config:
          workspace: !!js process.cwd()
          requirePeerReviewAfterReceipt: true
