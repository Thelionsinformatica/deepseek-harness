# The smoke driver owns an isolated cwd and registers the only model adapter.
- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.cwd() + '/sessions'
    compression: none
- name: '@deepseek-ai/dsh-storage'
- name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js process.cwd() + '/memory'
- name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- name: '@deepseek-ai/dsh-workspace'
- name: '@deepseek-ai/dsh-memory'
  config:
    provider: local
- name: '../../packages/memory/memory-local/lib/index.js'
- name: '@deepseek-ai/dsh-settings-file'
  config:
    path: !!js process.cwd() + '/settings.yaml'
    watch: false
- name: '@deepseek-ai/dsh-personal-memory'
  config:
    provider: local
- name: '@deepseek-ai/dsh-personal-memory-local'
  config:
    linking:
      enabled: false
- name: '@deepseek-ai/dsh-tool-memory'
  config:
    personalOwnerId: fixture-owner
    personalAutomaticRecall: true
    coreRecallLimit: 8
    coreRecallMaxChars: 4000
- name: '@deepseek-ai/dsh-tool-memory/review'
  config:
    reviewedBy: fixture-human
    administrationMode: full
    personalOwnerId: fixture-owner
