# Replay counterpart for the durable procedure-review surface. It includes
# cordis.yml directly because a config patch cannot target an entry behind a
# nested include, then mounts the workspace/procedure stores and replay adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: storage
            name: '@deepseek-ai/dsh-storage'
          - id: storage-json
            name: '@deepseek-ai/dsh-storage-json'
            config:
              root: './.storages'
          - id: storage-domain
            name: '@deepseek-ai/dsh-storage-domain'
            config:
              backend: json
          - id: workspace
            name: '@deepseek-ai/dsh-workspace'
          - id: procedure-learning
            name: '@deepseek-ai/dsh-tool-memory/procedure-learning'
            config:
              reviewedBy: snapshot-reviewer
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
