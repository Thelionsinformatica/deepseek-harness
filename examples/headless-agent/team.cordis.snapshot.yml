# Keyless Agent Teams composition over the real headless app and deterministic fixture adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: tool-subagent-control
        name: '@deepseek-ai/dsh-tool-subagent-control'
        disabled: true
      - id: tool-subagent-report
        name: '@deepseek-ai/dsh-tool-subagent-report'
        disabled: true
      - id: tool-subagent
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: one-shot
          maxDepth: 1
      - id: tool-subagent-fork
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: fork
          toolName: subagent_fork
          backgroundMode: one-shot
          maxDepth: 1
      - insert:
          - id: agent-team
            name: '@deepseek-ai/dsh-experimental-agent-team'
            config:
              completionRequiresReview: !!js process.env.DSH_TEAM_COMPLETION_REVIEW === '1'
          - id: tool-agent-team
            name: '@deepseek-ai/dsh-experimental-tool-agent-team'
          - id: team-fixture-llm
            name: './tests/fixtures/team-llm.mjs'
          - id: mission-storage
            name: '@deepseek-ai/dsh-storage'
            disabled: !!js process.env.DSH_TEAM_MISSION_CONTROL !== '1'
          - id: mission-storage-json
            name: '@deepseek-ai/dsh-storage-json'
            disabled: !!js process.env.DSH_TEAM_MISSION_CONTROL !== '1'
            config:
              root: ./.mission-control
          - id: mission-storage-domain
            name: '@deepseek-ai/dsh-storage-domain'
            disabled: !!js process.env.DSH_TEAM_MISSION_CONTROL !== '1'
            config:
              backend: json
          - id: mission-control
            name: '@deepseek-ai/dsh-experimental-agent-team/mission-control'
            disabled: !!js process.env.DSH_TEAM_MISSION_CONTROL !== '1'
            config:
              domainName: leon_collective
              owner: snapshot-owner
              workspace: !!js process.cwd()
              maxCalls: 2
              durationMs: 60000
