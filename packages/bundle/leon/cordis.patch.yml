# Leon host layer, applied after the dsh-base and dsh-web-app bundles. It
# mounts Leon's memory services and host-plane guards, keeps a durable session
# search index, and makes the `leon` agent preset (presets/leon.patch.yml) the
# default for new sessions.

# The derived history index lives on disk and opens on the first search, so
# startup stays quiet; it is rebuilt from session logs and never serves as
# canonical session storage.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('storages/session-query.sqlite')
    openAt: first-search

- id: agent-preset-registry
  config:
    default: leon

- insert:
    # Workspace memory: the provider-neutral seam with the local
    # storage-domain provider selected explicitly.
    - id: memory
      name: '@deepseek-ai/dsh-memory'
      config:
        provider: local

    - id: memory-local
      name: '@deepseek-ai/dsh-memory-local'
      config:
        # Corrections preserve prior revisions atomically. Set to v1 only as
        # an emergency rollback that resumes in-place overwrites.
        historyMode: temporal-v2
        # Semantic recall needs a loopback embeddings endpoint; a profile patch
        # enables it once that endpoint is running.
        semanticSearch:
          enabled: false

    # Personal memory keeps its own service, provider registry, and storage
    # domain; it crosses projects only inside the configured owner partition.
    - id: personal-memory
      name: '@deepseek-ai/dsh-personal-memory'
      config:
        provider: local

    - id: personal-memory-local
      name: '@deepseek-ai/dsh-personal-memory-local'
      config:
        historyMode: temporal-v2

    # The shadow candidate queue and its human review trail. Final writes
    # need the master switch, the exact workspace id, and the exact owner id;
    # nothing is written automatically until the operator opts in.
    - id: memory-candidate-review
      name: '@deepseek-ai/dsh-tool-memory/review'
      config:
        reviewedBy: leon-local-operator
        automaticWrite: false
        automaticWriteWorkspaceIds: []
        automaticWriteUserIds: []
        # Set back to read-only for an immediate mutation rollback.
        administrationMode: full
        personalOwnerId: leon-local-owner

    # Reviewed, workspace-scoped procedures. A candidate becomes reusable only
    # after the exact direct-human review command accepts it.
    - id: procedure-learning
      name: '@deepseek-ai/dsh-tool-memory/procedure-learning'
      config:
        reviewedBy: leon-local-operator

    # Two equivalent tool failures add logged recovery context and lock the
    # unchanged call; a response without final content gets one guided
    # continuation before failing visibly.
    - id: failure-recovery-policy
      name: '@deepseek-ai/dsh-failure-recovery-policy'
      config:
        maxEquivalentFailures: 2
        maxNoFinalResponseRecoveries: 1
